name: Copilot PM checkpoint checks

on:
  push:
    paths:
      - "src/pm_story_agents/copilot_*.py"
      - "src/pm_story_agents/documents.py"
      - "src/pm_story_agents/run_store.py"
      - "scripts/copilot_actions_stage.py"
      - "scripts/start_pm.py"
      - "examples/copilot-intake.json"
      - "tests/test_copilot_workflow.py"
      - "tests/test_pm_launcher.py"
      - "requirements-copilot.txt"
      - ".github/workflows/copilot-pm-checks.yml"
  pull_request:

permissions:
  contents: read

jobs:
  checkpoints:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements-copilot.txt
      - name: Test durable approval and automation logic without model calls
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -q
